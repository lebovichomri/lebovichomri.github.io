baseURL = "https://lebovichomri-art.github.io/"
languageCode = "en-us"
title = "Omri's Blog"
theme = "PaperMod"
paginate = 10

[params]
  author = "Omri Lebovich"
  description = "A tech and science enthusiast. I write about cybersecurity, physics, mathematics, and more."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableScrollToTop = false
  comments = false
  hidemeta = false
  showtoc = true
  tocopen = false

[params.homeInfoParams]
  Title = "Hi, I'm Omri Lebovich"
  Content = """A tech and science enthusiast.
  I write about cybersecurity, physics, mathematics, and more."""


[params.assets]
  disableHLJS = false

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
